name: CodeMirror CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and Build
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Build Windows application
        run: npm run make

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeMirror-Windows-Build
          path: out/make/**
          if-no-files-found: error
          retention-days: 7
